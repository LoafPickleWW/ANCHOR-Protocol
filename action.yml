name: ANCHOR — Algorand Supply Chain Integrity
description: Anchor software artifact hashes to the Algorand blockchain
author: LoafPickle Worldwide

inputs:
  mnemonic:
    description: Algorand signing wallet mnemonic (store in GitHub Secrets)
    required: true
  version:
    description: Package version being published
    required: false
    default: ${{ github.ref_name }}
  type:
    description: Anchor type — pre or post
    required: false
    default: post
  artifacts:
    description: Explicit artifact paths (comma separated). Auto-detects via npm pack if omitted.
    required: false
  network:
    description: Algorand network — mainnet or testnet
    required: false
    default: mainnet
  fail-on-error:
    description: Fail the workflow if anchoring fails
    required: false
    default: 'false'

outputs:
  tx-ids:
    description: Comma-separated Algorand transaction IDs for the anchor transactions
    value: ${{ steps.anchor.outputs.tx-ids }}
  hashes:
    description: Comma-separated SHA-256 hashes of the anchored artifacts
    value: ${{ steps.anchor.outputs.hashes }}

runs:
  using: "composite"
  steps:
    - name: Run ANCHOR Publish
      id: anchor
      shell: bash
      env:
        ANCHOR_MNEMONIC: ${{ inputs.mnemonic }}
        ANCHOR_NETWORK: ${{ inputs.network }}
      run: |
        # Construct arguments
        ARGS="publish --release ${{ inputs.version }} --type ${{ inputs.type }}"
        
        if [ -n "${{ inputs.artifacts }}" ]; then
          ARGS="$ARGS --artifacts ${{ inputs.artifacts }}"
        fi
        
        if [ "${{ inputs.fail-on-error }}" = "true" ]; then
          ARGS="$ARGS --fail-on-error"
        fi
        
        # Run via npx (mnemonic passed via ANCHOR_MNEMONIC env)
        npx @loafpickleww/anchor $ARGS
